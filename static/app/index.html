<!DOCTYPE html>
<html lang="en" ng-app="cortexAnalyzerPlaygroundApp" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Analyzer Template Helper</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="lib/html5-boilerplate/dist/css/normalize.css"
    />

    <link rel="stylesheet" href="static/css/bootstrap.min.css" />
    <link rel="stylesheet" href="static/css/bootstrap-theme.min.css" />
    <link rel="stylesheet" href="static/css/font-awesome.min.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="app-container" ng-controller="AppCtrl as appCtrl">
      <!-- <nav class="navbar navbar-default">
        <div class="container-fluid">
          <div class="navbar-header">
            <a class="navbar-brand" href="#">Cortex Analyzer Playground</a>
          </div>
          <div id="navbar" class="collapse navbar-collapse">
            <ul class="nav navbar-nav">
              <li><a href="#" ng-click="appCtrl.load()">Load sample</a></li>
              <li><a href="#">About</a></li>
            </ul>
          </div>
        </div>
      </nav> -->
      <div class="app-wrapper">
        <div class="app-input">
          <form class="form-inline">
            <button
              class="btn btn-default"
              type="button"
              ng-click="appCtrl.load()"
            >
              Load Sample
            </button>

            <button
              class="btn btn-primary"
              type="button"
              ng-click="appCtrl.generate()"
            >
              Generate Report
            </button>
            <div class="checkbox">
              <label>
                <input
                  type="checkbox"
                  ng-checked="appCtrl.failure"
                  ng-click="appCtrl.failure = !appCtrl.failure"
                />
                Simulate failure
              </label>
            </div>
          </form>

          <!-- Json input -->
          <div class="panel panel-default">
            <div class="panel-heading">Paste the analyzer report</div>
            <div class="panel-body">
              <!-- <textarea
                class="form-control"
                name="json"
                cols="30"
                rows="10"
                ng-model="appCtrl.json"
              ></textarea> -->

              <div
                ui-ace="{
                  useWrapMode : true,
                  showGutter: true,                  
                  mode: 'json'
                }"
                ng-model="appCtrl.json"
              ></div>
            </div>
          </div>

          <!-- HTML input -->
          <div class="panel panel-default">
            <div class="panel-heading">Paste the analyzer template</div>
            <div class="panel-body">
              <!-- <textarea
                class="form-control"
                name="html"
                cols="30"
                rows="10"
                ng-model="appCtrl.html"
              ></textarea> -->
              <div
                ui-ace="{
                  useWrapMode : true,
                  showGutter: true,                  
                  mode: 'html'
                }"
                ng-model="appCtrl.html"
              ></div>
            </div>
          </div>
        </div>

        <div class="app-output">
          <div class="text-center empty-message" ng-if="!appCtrl.content">
            No report available, let's generate it !
          </div>
          <div class="text-right" ng-if="appCtrl.content">
            <button
              class="btn btn-primary"
              type="button"
              ng-click="appCtrl.clear()"
            >
              Clear Report
            </button>
          </div>
          <report
            success="appCtrl.content.success"
            content="appCtrl.content"
            template="appCtrl.template"
          ></report>
        </div>
      </div>
    </div>

    <script
      type="text/javascript"
      src="lib/ace-builds/src-min-noconflict/ace.js"
    ></script>
    <script type="text/javascript" src="lib/angular/angular.js"></script>
    <script
      type="text/javascript"
      src="lib/angular-animate/angular-animate.min.js"
    ></script>
    <script
      type="text/javascript"
      src="lib/angular-ui-bootstrap/ui-bootstrap-tpls.js"
    ></script>
    <script type="text/javascript" src="lib/ui-ace/ui-ace.js"></script>
    <script type="text/javascript" src="app.js"></script>
    <script type="text/javascript" src="filters/custom-field-value.js"></script>
    <script type="text/javascript" src="filters/duration.js"></script>
    <script type="text/javascript" src="filters/ellipsis.js"></script>
    <script type="text/javascript" src="filters/fang.js"></script>
    <script type="text/javascript" src="filters/filesize.js"></script>
    <script type="text/javascript" src="filters/filter-value.js"></script>
    <script type="text/javascript" src="filters/flattern-object.js"></script>
    <script type="text/javascript" src="filters/getField.js"></script>
    <script type="text/javascript" src="filters/hash-type.js"></script>
    <script type="text/javascript" src="filters/limited-count.js"></script>
    <script type="text/javascript" src="filters/md5.js"></script>
    <script type="text/javascript" src="filters/offset.js"></script>
    <script type="text/javascript" src="filters/order-object-by.js"></script>
    <script type="text/javascript" src="filters/percent.js"></script>
    <script type="text/javascript" src="filters/sha256.js"></script>
    <script type="text/javascript" src="filters/shortDate.js"></script>
    <script type="text/javascript" src="filters/showDate.js"></script>
    <script type="text/javascript" src="filters/tag-value.js"></script>
    <script type="text/javascript" src="filters/urlencode.js"></script>
  </body>
</html>
